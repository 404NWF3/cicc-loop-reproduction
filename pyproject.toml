[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "loop-research"
version = "0.1.0"
description = "A lightweight, inspectable factor research loop with a web console"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "pyyaml>=6.0,<7",
]

[project.scripts]
loop-research = "loop_research.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.11,<1", "scipy>=1.14,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/loop_research"]

[tool.uv]
cache-dir = ".cache/uv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
